<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Client</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Place Order</h5>
      </div>
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label">Order ID</label>
          <input id="orderId" class="form-control" value="1" />
        </div>

        <div class="mb-3">
          <label class="form-label">User ID</label>
          <input id="userId" class="form-control" value="user-1" />
        </div>

        <hr />

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Items</h6>
          <button class="btn btn-sm btn-outline-secondary" onclick="addItem()">+ Add Item</button>
        </div>

        <div id="items">
          <div class="row g-2 mb-2 item">
            <div class="col-8">
              <input class="form-control itemId" placeholder="Item ID" value="1" />
            </div>
            <div class="col-4">
              <input class="form-control itemQty" type="number" placeholder="Qty" value="2" min="1" />
            </div>
          </div>
        </div>

        <div class="d-grid mt-3">
          <button class="btn btn-primary" onclick="placeOrder()">Place Order</button>
        </div>

      </div>
    </div>

    <div id="resultCard" class="card shadow-sm mt-4 d-none">
      <div class="card-header d-flex justify-content-between align-items-center" id="resultHeader">
        <span id="resultTitle">Result</span>
      </div>
      <div class="card-body">
        <pre id="result" class="mb-0" style="white-space: pre-wrap;"></pre>
      </div>
    </div>
  </div>

  <script src="./dist/bundle.js"></script>

  <script>
    function addItem() {
      const container = document.getElementById('items');
      const div = document.createElement('div');
      div.className = 'row g-2 mb-2 item';
      div.innerHTML = `
        <div class="col-8">
          <input class="form-control itemId" placeholder="Item ID" />
        </div>
        <div class="col-3">
          <input class="form-control itemQty" type="number" placeholder="Qty" value="1" min="1" />
        </div>
        <div class="col-1 d-flex align-items-center">
          <span style="cursor:pointer; color:#dc3545;" onclick="this.closest('.item').remove()">✕</span>
        </div>
      `;
      container.appendChild(div);
    }

    function showResult(success, content) {
      const card = document.getElementById('resultCard');
      const header = document.getElementById('resultHeader');
      const title = document.getElementById('resultTitle');
      const result = document.getElementById('result');

      card.classList.remove('d-none');
      header.className = `card-header d-flex justify-content-between align-items-center ${success ? 'bg-success' : 'bg-danger'} text-white`;
      title.textContent = success ? '✓ Order Placed' : '✕ Order Failed';
      result.textContent = content;
    }
  </script>

</body>
</html>
