<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <link rel="stylesheet" href="styles.css" />
    
  </head>
  <body>
  <!-- ── SIDEBAR ───────────────────────────────────────── -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">🤖</div>
        <span class="sidebar-title">AI Chat</span>
      </div>

      <button class="new-chat-btn" onclick="newChat()">
        💬  New chat
      </button>

      <div class="sessions-label">History</div>
      <div id="session-list"></div>

      <div class="sidebar-bottom">
        <button class="api-key-toggle" onclick="toggleApiPanel()">
          <span class="key-dot" id="key-dot"></span>
          <span id="key-toggle-label">Set API Key</span>
        </button>
        <div id="api-key-panel">
          <input id="api-key-input" type="password" placeholder="sk-..." autocomplete="off" />
          <button class="key-save-btn" onclick="saveApiKey()">Save key</button>
        </div>
      </div>
    </aside>

    <!-- ── MAIN ──────────────────────────────────────────── -->
    <main id="main">
      <div id="topbar">
        <div class="topbar-title" id="chat-title">New chat</div>

        <div class="mode-toggle">
          <button class="mode-btn active" id="btn-text" onclick="setMode('text')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Text
          </button>
          <button class="mode-btn" id="btn-image" onclick="setMode('image')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Image
          </button>
        </div>

        <select class="model-select" id="model-select" onchange="onModelChange()">
          <optgroup label="Text">
            <!-- <option value="accounts/fireworks/models/gpt-oss-20b">GPT-4OSS 20B</option> -->
            <option value="gpt-4o-mini">GPT-4o Mini</option>
            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
          </optgroup>
          <optgroup label="Image">
            <option value="gpt-image-1-mini">GPT-Image 1 mini</option>
          </optgroup>
        </select>

        <button class="clear-btn" onclick="clearMessages()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          Clear
        </button>
      </div>

      <div id="messages">
        <div id="empty-state">
          <div class="empty-icon">✦</div>
          <h2>Start a conversation</h2>
          <p>Use <strong>Text</strong> mode for chat or <strong>Image</strong> mode to generate images.</p>
          <div class="suggestion-chips" id="chips"></div>
        </div>
      </div>

      <div class="image-hint" id="image-hint" style="display:none;">
        Image mode — describe what you want to generate. Each message creates a new image.
      </div>

      <div id="input-area">
        <div id="image-url-row" style="display:none; padding: 0 0 6px 0;">
          <input
            id="image-url-input"
            type="url"
            placeholder="https://..."
            style="width:100%;"
          />
        </div>
        <div class="input-wrap">
          <textarea
            id="user-input"
            placeholder="Send a message…"
            rows="1"
            onkeydown="handleKeyDown(event)"
            oninput="autoResize(this); updateSendBtn()"
          ></textarea>
          <button id="send-btn" onclick="sendMessage()" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
        <div class="input-meta">
          <span class="token-count" id="token-count"></span>
        </div>
      </div>
    </main>

    <div id="toast"></div>

    <script src="main.js"></script>
  </body>
</html>
